name: Security & quality

on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # weekly, catches newly published advisories

jobs:
  check:
    name: Typecheck, build, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - name: Dependency audit (fails on high/critical)
        run: pnpm audit --prod --audit-level=high
      - name: Security smoke test against the built server
        run: |
          NODE_ENV=production PORT=3000 node dist/index.js &
          sleep 3
          node scripts/security-smoke.mjs http://localhost:3000

  app-quality:
    name: App quality (throttled phone)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npx playwright install --with-deps chromium
      - name: Metrics, routes and flows with zero JS errors
        run: |
          NODE_ENV=production PORT=3000 node dist/index.js &
          sleep 3
          pnpm test:app http://localhost:3000

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
