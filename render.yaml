# Despliegue en Render: Dashboard -> New -> Blueprint -> este repo.
#
# `sync: false` significa "Render te la pide al crear el servicio, y no
# queda escrita en ningún archivo". Así es como las llaves llegan al
# servidor sin pasar nunca por el repo.
#
# Casi todas son opcionales: si dejas una en blanco, esa integración se
# queda apagada y la app sigue funcionando (lo dice el panel de
# Integraciones del dashboard). Las que NO son opcionales están marcadas
# abajo. Se pueden llenar después desde Render -> Environment sin volver
# a desplegar código.
services:
  - type: web
    name: easycomex
    runtime: node
    # `starter`: USD 7/mes, siempre despierta. El plan `free` hacía que
    # la app durmiera tras 15 minutos sin tráfico (~50 segundos para
    # despertar) y que cada despliegue tumbara el servicio entero, que es
    # de donde salían los 502 mientras construía.
    #
    # Ojo: el plan del espacio de trabajo (Professional) y el tipo de
    # instancia de este servicio son cosas distintas. Pagar el primero no
    # mueve el segundo — eso lo decide esta línea.
    plan: starter
    region: oregon
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    # Render reinicia el servicio si esto deja de responder. La ruta no
    # expone nada a quien no esté autenticado.
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Sin fijarla, Render elige su versión por defecto, que puede ser
      # más vieja que la que usan el CI y el build local.
      - key: NODE_VERSION
        value: 22
      # Playwright trae un postinstall que se baja Chromium: unos 150 MB
      # que en el servidor no se usan nunca —las pruebas de navegador
      # corren en CI y en tu máquina, no en producción— y que alargan
      # cada despliegue. Con el caché de dependencias caliente no se
      # notaba; al cambiar el lockfile se nota mucho.
      - key: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD
        value: 1

      # --- Obligatorias para que la app haga algo útil ----------------
      # La URL pública del servicio, ya con https. Stripe y Wompi la usan
      # para devolver al cliente después de pagar, y define qué orígenes
      # pueden llamar a /api. Sin ella, la app confía en el host de la
      # petición, que se puede falsificar.
      - key: PUBLIC_APP_URL
        sync: false
      # Supabase -> Project Settings -> API
      - key: VITE_SUPABASE_URL
        sync: false
      # La llave pública: `anon`/`public` en proyectos viejos (empieza
      # con eyJ...), **Publishable key** (sb_publishable_...) en los
      # nuevos. Cópiala con el botón de copiar: la tabla la muestra
      # cortada con "..." y ese carácter rompe todas las peticiones.
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      # La otra: `service_role` en proyectos viejos, **Secret key**
      # (sb_secret_...) en los nuevos. Salta la seguridad de todas las
      # tablas: es lo que permite registrar un pago y guardar un
      # diagnóstico. Solo acá, nunca con prefijo VITE_.
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      # --- Wompi: TODOS los cobros (SETUP.md §2b) ---------------------
      # Sin estas cuatro no se puede cobrar nada: ni el plan de acción
      # del diagnóstico, ni el análisis de mercado, ni los reportes de
      # ROI, ni las consultas de Marco Polo. Stripe es opcional; Wompi,
      # para un negocio que cobra en Colombia, no lo es.
      #
      # La URL de eventos que va en el panel de Wompi es una sola:
      #   https://TU-DOMINIO/api/wompi-events
      - key: WOMPI_PUBLIC_KEY
        sync: false
      - key: WOMPI_PRIVATE_KEY
        sync: false
      - key: WOMPI_INTEGRITY_SECRET
        sync: false
      - key: WOMPI_EVENTS_SECRET
        sync: false
      # `sandbox` mientras pruebas con llaves pub_test_/prv_test_.
      - key: WOMPI_ENV
        value: sandbox
      # Precio del plan de acción, en centavos de peso. 3990000 = $39.900
      - key: DIAGNOSTIC_PRICE_COP_CENTS
        value: 3990000
      - key: DIAGNOSTIC_PRICE_USD_DISPLAY
        value: "9.99"

      # --- Precios del resto del catálogo (server/catalog.ts) ---------
      # Todo se cobra en pesos. El dólar es sólo la etiqueta que ve quien
      # no está en Colombia; su banco convierte.
      #
      # USD_COP_RATE es la tasa con la que se pasan los precios
      # publicados en dólares a pesos. En 4000, USD 9.99 da exactamente
      # los $39.900 que ya dice la web. Súbela o bájala cuando se mueva
      # el dólar — es un solo número.
      - key: USD_COP_RATE
        value: 4000
      # Y si querés un precio en pesos redondo, fijalo acá (en PESOS, no
      # en centavos) y manda sobre la conversión. Descomentá el que uses.
      # - key: PRICE_ANALISIS_MERCADO_COP
      #   value: 2000000
      # - key: PRICE_CREDITOS_MARCO_POLO_COP
      #   value: 76000
      # - key: PRICE_REPORTE_DETALLE_COP
      #   value: 159600
      # - key: PRICE_REPORTE_PRONOSTICO_COP
      #   value: 399600

      # --- Stripe: opcional, para cobrar en dólares (SETUP.md §2) -----
      # Si estas están puestas, el plan que tenga su price ID se cobra
      # por Stripe; lo demás sigue yendo por Wompi. Si no están, todo va
      # por Wompi y no falta nada.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ANALISIS_MERCADO
        sync: false
      - key: STRIPE_PRICE_ACOMPANAMIENTO
        sync: false
      - key: STRIPE_PRICE_CREDITOS_MARCO_POLO
        sync: false
      - key: STRIPE_PRICE_REPORTE_DETALLE
        sync: false
      - key: STRIPE_PRICE_REPORTE_PRONOSTICO
        sync: false
      - key: STRIPE_PRICE_DIAGNOSTICO_MADUREZ
        sync: false

      # --- Correo saliente (Resend) -----------------------------------
      # Sin estas, la app no manda un solo correo: el comprador del
      # diagnóstico no recibe el enlace para volver a lo que pagó, y un
      # lead que entra de madrugada se queda sólo en la campanita.
      # resend.com -> API Keys. El dominio hay que verificarlo allá.
      - key: RESEND_API_KEY
        sync: false
      # Remitente verificado, p. ej. "Easycomex <hola@easycomex.com>"
      - key: EMAIL_FROM
        sync: false
      # A dónde le llegan los leads al equipo.
      - key: TEAM_EMAIL
        sync: false

      # --- Marco Polo -------------------------------------------------
      # Sin la de Anthropic, el chat sigue respondiendo con su guion
      # básico en vez de con IA.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Voz premium. Sin esto usa la del navegador, que es gratis.
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      # Ambos tienen valor por defecto en el código; solo se ponen acá
      # para cambiar de modelo sin tocar el código.
      - key: ANTHROPIC_MODEL
        sync: false
      - key: ELEVENLABS_MODEL_ID
        sync: false

      # --- Partidas sugeridas (SETUP §2d) -----------------------------
      # Las dos llaves del proyecto en developer.fedex.com. FEDEX_ENV
      # vacío es sandbox; `production` apunta a producción.
      - key: FEDEX_CLIENT_ID
        sync: false
      - key: FEDEX_CLIENT_SECRET
        sync: false
      - key: FEDEX_ENV
        sync: false

      # --- Inteligencia de mercado (SETUP.md) -------------------------
      # Kalodata: con la llave basta, el endpoint ya lo conoce el código.
      - key: KALODATA_API_KEY
        sync: false
      - key: KALODATA_API_URL
        sync: false
      - key: KALODATA_AUTH_NAME
        sync: false
      # Sicex entrega los datos como una carpeta de Azure con un SAS.
      # Es una credencial viva y con vencimiento.
      - key: SICEX_SAS_URL
        sync: false
      - key: SICEX_API_KEY
        sync: false
      - key: SICEX_API_URL
        sync: false

      # --- Notificaciones push ----------------------------------------
      # Sin esto la campanita dentro de la app sigue funcionando; lo que
      # no llega es la notificación con la app cerrada.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VITE_VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: PUSH_WEBHOOK_SECRET
        sync: false

      # --- Monitoreo de errores ---------------------------------------
      # Sin esto todo va a los logs de Render y nada más.
      - key: SENTRY_DSN
        sync: false
      - key: VITE_SENTRY_DSN
        sync: false

      # --- Marketing y agenda -----------------------------------------
      - key: VITE_CALENDLY_URL
        sync: false
      - key: VITE_META_PIXEL_ID
        sync: false
      - key: VITE_TIKTOK_PIXEL_ID
        sync: false
      - key: VITE_GA_MEASUREMENT_ID
        sync: false
