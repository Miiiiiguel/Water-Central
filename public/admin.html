<meta name="theme-color" content="#130B2E">
<title>Administración · USACARGOS SHOP</title>
<link rel="preload" href="/fonts/inter.woff2" as="font" type="font/woff2" crossorigin>

<body class="adm">
<main id="login" class="login" hidden>
  <form class="login-card" id="loginForm">
    <div class="brand" style="color:var(--text)"><span class="mark"><svg class="ico" style="color:#fff"><use href="#i-package"/></svg></span><span class="word"><span><b>USA</b>CARGOS</span><span class="shop" style="background:var(--deep);color:#fff">ADMIN</span></span></div>
    <h1>Ingresa a tu tienda</h1>
    <label class="field"><span>Contraseña</span><input id="pw" type="password" autocomplete="current-password" required></label>
    <p id="loginErr" class="alert" hidden></p>
    <button class="btn primary block xl" type="submit">Entrar</button>
  </form>
</main>

<div id="app" class="shell" hidden>
  <aside class="side">
    <a class="brand" href="#/inicio"><span class="mark"><svg class="ico" style="color:#fff"><use href="#i-package"/></svg></span><span class="word"><span><b>USA</b>CARGOS</span><span class="shop">ADMIN</span></span></a>
    <nav id="nav">
      <a href="#/inicio" data-r="inicio"><svg class="ico"><use href="#i-home"/></svg>Inicio</a>
      <a href="#/pedidos" data-r="pedidos"><svg class="ico"><use href="#i-receipt"/></svg>Pedidos<span class="nb" id="nbShip" hidden></span></a>
      <a href="#/productos" data-r="productos"><svg class="ico"><use href="#i-package"/></svg>Productos</a>
      <a href="#/vendedores" data-r="vendedores"><svg class="ico"><use href="#i-users"/></svg>Vendedores</a>
    </nav>
    <div class="side-foot">
      <a href="/" target="_blank" rel="noopener"><svg class="ico"><use href="#i-ext"/></svg>Ver tienda</a>
      <button id="logout" type="button"><svg class="ico"><use href="#i-logout"/></svg>Salir</button>
    </div>
  </aside>
  <main id="main" class="main" tabindex="-1"></main>
  <nav class="tabs" aria-label="Secciones">
    <a href="#/inicio" data-r="inicio"><svg class="ico"><use href="#i-home"/></svg>Inicio</a>
    <a href="#/pedidos" data-r="pedidos"><svg class="ico"><use href="#i-receipt"/></svg>Pedidos<span class="nb" id="nbShip2" hidden></span></a>
    <a href="#/productos" data-r="productos"><svg class="ico"><use href="#i-package"/></svg>Productos</a>
    <a href="#/vendedores" data-r="vendedores"><svg class="ico"><use href="#i-users"/></svg>Vendedores</a>
  </nav>
</div>

<div id="modal" class="modal" hidden></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
