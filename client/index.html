<!doctype html>
<html lang="es">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO Meta Tags -->
    <title>Easycomex | Lleva tu marca a vender en Estados Unidos</title>
    <meta name="description" content="Easycomex ayuda a marcas latinoamericanas a vender en Amazon, TikTok Shop y Shopify en Estados Unidos: nuevos canales de venta, logística internacional, Prep Center en USA, estrategia ecommerce e inteligencia de mercado." />
    <meta name="keywords" content="vender en Amazon USA, TikTok Shop, Shopify, prep center USA, logistica internacional, comercio exterior, ecommerce Estados Unidos, FBA, expansion internacional marcas" />
    <meta name="author" content="Easycomex" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://easycomex.com/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://easycomex.com/" />
    <meta property="og:title" content="Easycomex | Lleva tu marca a vender en Estados Unidos" />
    <meta property="og:description" content="Nuevos canales de venta, logística internacional, Prep Center en USA e inteligencia de mercado para marcas latinoamericanas que quieren crecer en USA." />
    <meta property="og:site_name" content="Easycomex" />
    <meta property="og:locale" content="es_LA" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Easycomex | Lleva tu marca a vender en Estados Unidos" />
    <meta name="twitter:description" content="Desbloquea tu verdadero potencial de ecommerce en Amazon, TikTok Shop y Shopify." />

    <!-- Additional SEO -->
    <meta name="theme-color" content="#1B1A45" />
    <meta name="format-detection" content="telephone=yes" />

    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png" />

    <!-- Structured Data / Schema.org -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Easycomex",
      "description": "Agencia de crecimiento ecommerce que ayuda a marcas latinoamericanas a vender en Estados Unidos a través de Amazon, TikTok Shop y Shopify, con logística internacional y Prep Center en USA.",
      "url": "https://easycomex.com",
      "email": "info@easycomex.com",
      "sameAs": []
    }
    </script>

    <!-- FAQ Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "¿A qué marcas ayuda Easycomex?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Trabajamos con marcas latinoamericanas que ya venden y quieren expandirse al mercado de Estados Unidos a través de Amazon, TikTok Shop y Shopify."
          }
        },
        {
          "@type": "Question",
          "name": "¿Cómo empiezo?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Empieza con un diagnóstico gratuito de tu situación actual. Con base en eso te proponemos un plan de crecimiento y, si lo necesitas, un análisis de mercado y competencia."
          }
        },
        {
          "@type": "Question",
          "name": "¿Manejan la logística de mis envíos a USA?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sí. Ofrecemos logística internacional puerta a puerta (aérea y marítima) y un Prep Center en USA que recibe, inspecciona, etiqueta y envía tus productos a FBA o a tus clientes finales."
          }
        }
      ]
    }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

    <!-- Splash screen styles (removed by client/src/main.tsx once the app mounts) -->
    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: radial-gradient(circle at 50% 40%, #fff6f0 0%, #ffffff 70%);
        transition: opacity 0.35s ease;
      }
      #app-splash.app-splash-hidden {
        opacity: 0;
        pointer-events: none;
      }
      .app-splash-logo {
        font-family: 'Baloo 2', 'Inter', sans-serif;
        font-weight: 800;
        font-size: 2rem;
        letter-spacing: -0.02em;
      }
      .app-splash-logo .easy { color: #FF5A36; }
      .app-splash-logo .comex { color: #1B1A45; }
      .app-splash-spinner {
        width: 28px;
        height: 28px;
        border-radius: 9999px;
        border: 3px solid #FFF1EA;
        border-top-color: #FF5A36;
        animation: app-splash-spin 0.8s linear infinite;
      }
      @keyframes app-splash-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>

  <body>
    <div id="app-splash" aria-hidden="true">
      <span class="app-splash-logo"><span class="easy">easy</span><span class="comex">comex</span></span>
      <span class="app-splash-spinner"></span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>

</html>
